spring.application.name=galle-hospital

spring.datasource.url=jdbc:mysql://localhost:3306/gallehospital?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sanjana@2004}
spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto= update
spring.jpa.show-sql=true


server.port=5000

app.password-reset.token-expiration-minutes=15
app.frontend.reset-password-url=http://localhost:3000/reset-password

openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6}
openai.system-message=You are a helpful assistant for the Galle Hospital Management System. Give concise answers and do not provide medical diagnosis.

# Configure these values with your real SMTP account before sending emails.
# Example for Gmail: use an app password, not your normal account password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
